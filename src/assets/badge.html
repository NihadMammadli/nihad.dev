<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanan Mammadli</title>

<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
width:100%;
display:flex;
align-items:center;
justify-content:flex-end;
font-family:"Urbanist", sans-serif;
background:#0e0e0e;
overflow:hidden;
}

/* Polygon Gradient Background */

.background{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(135deg,#1a1a1a,#111,#000);
}

.background::before{
content:"";
position:absolute;
width:140%;
height:140%;
background:
polygon(0% 0%, 100% 0%, 85% 40%, 100% 100%, 0% 100%, 15% 60%);
background:linear-gradient(120deg,#1f1f1f,#0b0b0b,#181818);
clip-path:polygon(0 0,100% 0,85% 40%,100% 100%,0 100%,15% 60%);
opacity:0.8;
}

/* Card */

.card{
position:relative;
text-align:right;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:80px 120px;
background:rgba(0,0,0,0.45);
border:none;
border-left:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(6px);
}

h1{
color:#ffffff;
font-size:224px;
letter-spacing:3px;
font-weight:500;
margin-bottom:15px;
}

h2{
color:#cfcfcf;
font-size:84px;
font-weight:300;
letter-spacing:4px;
text-transform:uppercase;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="card">
<h1>Nihad Mammadli</h1>
<h2>Frontend Engineer</h2>
</div>

</body>
</html>
